name: ci

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

# Every step runs in bash with -o pipefail: a test piped into tee fails the
# step when the test fails (GitHub's default bash runs without pipefail).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/unit-tests.txt"

      - name: Build
        run: go build ./...

      - name: Cross-compile check (every release target)
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Unit tests'
            echo '```'
            cat "$RUNNER_TEMP/unit-tests.txt" 2>/dev/null || echo "(the tests did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the printed results with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: |
            ${{ runner.temp }}/unit-tests.txt
          if-no-files-found: ignore

  systems:
    # The build job above tests on Linux x86-64; the programs also ship for
    # Windows, macOS and ARM, so the tests and a small load test (real
    # programs, the server killed and started again) run there too.
    name: Tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Linux on ARM
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/unit-tests.txt"

      - name: Load test (4 clients, the server killed during ticket entry)
        run: go run ./scripts/loadtest -clients 4 -tickets 400 -baskets 60 -entry 8s -outage 3s -rush 3s -storm 2s -wifi-drop 4s -late 3s -crash-down 1s -out "$RUNNER_TEMP/load-test.txt"

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Unit tests on ${{ matrix.name }}'
            echo '```'
            cat "$RUNNER_TEMP/unit-tests.txt" 2>/dev/null || echo "(the tests did not run)"
            echo '```'
            echo '### Load test on ${{ matrix.name }}'
            echo '```'
            cat "$RUNNER_TEMP/load-test.txt" 2>/dev/null || echo "(the load test did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the printed results with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/unit-tests.txt
            ${{ runner.temp }}/load-test.txt
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            scripts/browser/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the real Linux programs
        run: go build -o "$RUNNER_TEMP/" ./cmd/tam-client ./cmd/tam-server

      - name: Install the pinned browser test tools
        working-directory: scripts/browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Saves, newer values kept, reports from a client's copy
        working-directory: scripts/browser
        env:
          TAM_CLIENT_BIN: ${{ runner.temp }}/tam-client
          TAM_SERVER_BIN: ${{ runner.temp }}/tam-server
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/browser-tests.txt"

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Browser tests'
            echo '```'
            cat "$RUNNER_TEMP/browser-tests.txt" 2>/dev/null || echo "(the tests did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests
          path: |
            ${{ runner.temp }}/browser-tests.txt
            scripts/browser/playwright-report/
            scripts/browser/test-results/
          if-no-files-found: ignore

  load:
    name: Race detector and load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests with the race detector
        run: go test -race ./... 2>&1 | tee "$RUNNER_TEMP/race-tests.txt"

      - name: Load test with the race detector (12 clients, the server killed during ticket entry)
        run: |
          mkdir -p "$RUNNER_TEMP/tam"
          go build -race -o "$RUNNER_TEMP/tam/" ./cmd/tam-server ./cmd/tam-client
          go run -race ./scripts/loadtest -bin "$RUNNER_TEMP/tam" -clients 12 -tickets 3000 -baskets 500 -entry 20s -outage 5s -rush 5s -out "$RUNNER_TEMP/load-test.txt"

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Unit tests with the race detector'
            echo '```'
            cat "$RUNNER_TEMP/race-tests.txt" 2>/dev/null || echo "(the tests did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '### Load test'
            echo '```'
            cat "$RUNNER_TEMP/load-test.txt" 2>/dev/null || echo "(the load test did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the printed results with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: race-and-load-test
          path: |
            ${{ runner.temp }}/race-tests.txt
            ${{ runner.temp }}/load-test.txt
          if-no-files-found: ignore

  nix:
    name: Nix package and NixOS test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Let the NixOS test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Package (the web app and both programs, with the unit tests)
        run: nix build -L 2>&1 | tee "$RUNNER_TEMP/nix-build.txt"

      - name: NixOS test (a server, a client that pairs with it, and an HTTPS server)
        run: nix flake check -L 2>&1 | tee "$RUNNER_TEMP/nixos-test.txt"

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Unit tests in the Nix build sandbox'
            echo '```'
            grep -E '^tam> (ok|FAIL|---|panic)' "$RUNNER_TEMP/nix-build.txt" | sed 's/^tam> //' || echo "(no test output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '### NixOS test'
            echo '```'
            grep -E 'subtest: |finished: subtest|test script finished|!!! ' "$RUNNER_TEMP/nixos-test.txt" | sed 's/^vm-test-run-tam> //' || echo "(no NixOS test output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the printed results with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nix-and-nixos-test
          path: |
            ${{ runner.temp }}/nix-build.txt
            ${{ runner.temp }}/nixos-test.txt
          if-no-files-found: ignore

  packages:
    name: Release build, and the Linux packages installed, upgraded and removed
    runs-on: ubuntu-latest
    # bash with -o pipefail: a test piped into tee fails its step when it fails.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for git describe

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Release build (every system, the version from git describe)
        run: |
          version="$(git describe --tags --always --dirty)"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          {
            SKIP_WEB=1 VERSION="$version" ./build.sh release
            echo
            echo "The Linux archive, as tar lists it:"
            tar -tvzf build/tam-client-*-linux-amd64.tar.gz
          } 2>&1 | tee "$RUNNER_TEMP/release-build.txt"

      - name: Keep the archives, the Windows programs and the packages
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.exe
            build/*.deb
            build/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: The same version as package revision 2, to upgrade to
        run: |
          mkdir -p "$RUNNER_TEMP/packages-1" "$RUNNER_TEMP/packages-2"
          cp build/*_amd64.deb build/*.x86_64.rpm "$RUNNER_TEMP/packages-1/"
          SKIP_WEB=1 VERSION="$PACKAGE_VERSION" PKG_RELEASE=2 ./build.sh release > "$RUNNER_TEMP/release-build-2.txt" 2>&1
          cp build/*_amd64.deb build/*.x86_64.rpm "$RUNNER_TEMP/packages-2/"
          ls -l "$RUNNER_TEMP/packages-1" "$RUNNER_TEMP/packages-2"

      - name: The .deb packages on this runner, with systemd
        run: sudo deploy/linux/test-packages.sh "$RUNNER_TEMP/packages-1" "$RUNNER_TEMP/packages-2" 2>&1 | tee "$RUNNER_TEMP/deb-packages.txt"

      - name: The .rpm packages in a Fedora container, with a stand-in for systemctl
        run: |
          docker run --rm -v "$PWD/deploy/linux:/test:ro" \
            -v "$RUNNER_TEMP/packages-1:/packages-1:ro" -v "$RUNNER_TEMP/packages-2:/packages-2:ro" \
            fedora:42 bash /test/test-packages.sh --fake-systemd /packages-1 /packages-2 2>&1 | tee "$RUNNER_TEMP/rpm-packages.txt"

      - name: Printed results on the run page
        if: always()
        run: |
          {
            echo '### Release build'
            echo '```'
            cat "$RUNNER_TEMP/release-build.txt" 2>/dev/null || echo "(the build did not run)"
            echo '```'
            echo '### The .deb packages on the runner, with systemd'
            echo '```'
            cat "$RUNNER_TEMP/deb-packages.txt" 2>/dev/null || echo "(the test did not run)"
            echo '```'
            echo '### The .rpm packages in a Fedora container, with a stand-in for systemctl'
            echo '```'
            cat "$RUNNER_TEMP/rpm-packages.txt" 2>/dev/null || echo "(the test did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the printed results with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            ${{ runner.temp }}/release-build.txt
            ${{ runner.temp }}/release-build-2.txt
            ${{ runner.temp }}/deb-packages.txt
            ${{ runner.temp }}/rpm-packages.txt
          if-no-files-found: ignore
